<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Mixer Pro - GitHub Pages</title>
    <style>
        body {
            background: #111;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .mixer-container {
            background: #222;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.2);
            border: 2px solid #00ff88;
            display: flex;
            gap: 40px;
            align-items: center;
            max-width: 900px;
        }

        .deck {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .vinyl {
            width: 200px;
            height: 200px;
            background: #000;
            border-radius: 50%;
            border: 8px solid #222;
            box-shadow: inset 0 0 10px #333;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.1s linear;
        }

        .vinyl-cover {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #444;
            background-size: cover;
            border: 3px solid #111;
        }

        .controls {
            margin-top: 15px;
            width: 100%;
            text-align: center;
        }

        .btn {
            background: #00ff88;
            color: #111;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            margin: 5px;
        }

        .btn:hover {
            background: #00cc6e;
        }

        .btn-mute {
            background: #ff3333;
            color: white;
        }

        .slider-label {
            font-size: 11px;
            color: #aaa;
            display: block;
            margin-top: 10px;
        }

        .slider {
            width: 100%;
            margin: 5px 0;
            accent-color: #00ff88;
        }

        .center-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 150px;
            background: #151515;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #444;
        }

        .eq-group {
            margin: 10px 0;
            text-align: center;
            width: 100%;
        }

        .crossfader-container {
            width: 100%;
            margin-top: 25px;
            text-align: center;
        }

        .search-section {
            margin-top: 25px;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .search-input {
            width: 70%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #222;
            color: white;
        }

        .results {
            margin-top: 15px;
            max-height: 150px;
            overflow-y: auto;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 5px;
        }

        .track-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }

        .spinning {
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <h1 style="color: #00ff88; text-shadow: 0 0 10px rgba(0,255,136,0.5);">MUSIC MIXER PRO</h1>
    <p style="font-size: 12px; color: #888; margin-top: -10px;">Powered by Deezer API & HTML5 Web Audio</p>

    <div class="mixer-container">
        <!-- DECK A -->
        <div class="deck">
            <h3>DECK A</h3>
            <div id="vinyl-a" class="vinyl">
                <div id="cover-a" class="vinyl-cover"></div>
            </div>
            <div class="controls">
                <button class="btn" id="play-a">PLAY/CUE</button>
                <button class="btn btn-mute" id="mute-a">MUTE</button>
                <label class="slider-label">VOLUMEN</label>
                <input type="range" class="slider" id="vol-a" min="0" max="1" step="0.01" value="0.8">
                <label class="slider-label">FILTRO FX (LPF)</label>
                <input type="range" class="slider" id="filter-a" min="200" max="20000" step="1" value="20000">
            </div>
        </div>

        <!-- MIXER CENTRAL -->
        <div class="center-panel">
            <h4>MIXER</h4>
            <div class="eq-group">
                <label class="slider-label">HI EQ</label>
                <input type="range" class="slider" id="eq-hi" min="-12" max="12" step="1" value="0">
            </div>
            <div class="eq-group">
                <label class="slider-label">MID EQ</label>
                <input type="range" class="slider" id="eq-mid" min="-12" max="12" step="1" value="0">
            </div>
            <div class="eq-group">
                <label class="slider-label">LOW EQ</label>
                <input type="range" class="slider" id="eq-low" min="-12" max="12" step="1" value="0">
            </div>

            <div class="crossfader-container">
                <label class="slider-label">CROSSFADER</label>
                <input type="range" class="slider" id="crossfader" min="-1" max="1" step="0.01" value="0">
            </div>
        </div>

        <!-- DECK B -->
        <div class="deck">
            <h3>DECK B</h3>
            <div id="vinyl-b" class="vinyl">
                <div id="cover-b" class="vinyl-cover"></div>
            </div>
            <div class="controls">
                <button class="btn" id="play-b">PLAY/CUE</button>
                <button class="btn btn-mute" id="mute-b">MUTE</button>
                <label class="slider-label">VOLUMEN</label>
                <input type="range" class="slider" id="vol-b" min="0" max="1" step="0.01" value="0.8">
                <label class="slider-label">FILTRO FX (LPF)</label>
                <input type="range" class="slider" id="filter-b" min="200" max="20000" step="1" value="20000">
            </div>
        </div>
    </div>

    <!-- BUSCADOR -->
    <div class="search-section">
        <input type="text" id="search-input" class="search-input"
            placeholder="Busca canciones o artistas (Ej: Tech House)...">
        <button class="btn" id="search-btn">Buscar</button>
        <div class="results" id="results">Busca algo para cargar pistas en los platos.</div>
    </div>

    <script src="script.js"></script>
</body>

</html>
