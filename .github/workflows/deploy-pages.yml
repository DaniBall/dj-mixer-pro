# Publica únicamente la interfaz estática; Express se utiliza solo para desarrollo local.
name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Pages necesita permiso de despliegue y un token OIDC; el repositorio solo se consulta.
permissions:
  contents: read
  pages: write
  id-token: write

# Serializa publicaciones sin interrumpir un despliegue que ya está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No hay compilación ni dependencias npm necesarias para publicar HTML y JavaScript.
      - name: Check JavaScript syntax
        run: node --check public/script.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # index.html queda en la raíz del artefacto y conserva la ruta relativa a script.js.
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
